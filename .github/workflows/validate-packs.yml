# Validates and balance-checks every pack in packs/ with DDDnD's own validator,
# through DDDnD's reusable workflow (ADR 0011 in mooeypoo/DDDnD).
name: Validate packs

on:
  push:
  pull_request:

jobs:
  validate:
    # pack-validator-v1 is a moving major tag in DDDnD: it only moves forward
    # for compatible validator changes. Keep both refs the same.
    uses: mooeypoo/DDDnD/.github/workflows/validate-pack.yml@pack-validator-v1
    with:
      dddnd-ref: pack-validator-v1
      packs: packs/*/
