# Validates and balance-checks every pack in packs/ with DDDnD's own validator,
# through DDDnD's reusable workflow (ADR 0011 in mooeypoo/DDDnD).
name: Validate packs

on:
  push:
  pull_request:

jobs:
  validate:
    # Until community pack support is merged into DDDnD, both refs point at its
    # feature branch. After the merge, switch both to the pack-validator-v1 tag.
    uses: mooeypoo/DDDnD/.github/workflows/validate-pack.yml@feat/content-packs-mvp1
    with:
      dddnd-ref: feat/content-packs-mvp1
      packs: packs/*/
